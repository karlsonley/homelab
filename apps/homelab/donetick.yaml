---
apiVersion: v1
kind: Namespace
metadata:
  name: donetick
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: donetick
  namespace: donetick
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: scaleway-secret-manager
    kind: ClusterSecretStore
  target:
    name: donetick
    template:
      type: Opaque
      data:
        jwt_secret: "{{ .jwt_secret }}"
        db_password: "{{ .db_password }}"
        oidc_client_id: "{{ .oidc_client_id }}"
        oidc_client_secret: "{{ .oidc_client_secret }}"
  data:
  - secretKey: jwt_secret
    remoteRef:
      key: name:homelab
      property: donetick_jwt_secret
      version: latest_enabled
  - secretKey: db_password
    remoteRef:
      key: name:homelab
      property: donetick_db_password
      version: latest_enabled
  - secretKey: oidc_client_id
    remoteRef:
      key: name:homelab
      property: pocket_id_oidc_client_id
      version: latest_enabled
  - secretKey: oidc_client_secret
    remoteRef:
      key: name:homelab
      property: pocket_id_oidc_client_secret
      version: latest_enabled
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: donetick-db-password
  namespace: donetick
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: scaleway-secret-manager
    kind: ClusterSecretStore
  target:
    name: donetick-db-password
    template:
      type: Opaque
      data:
        username: "donetick"
        password: "{{ .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: name:homelab
      property: donetick_db_password
      version: latest_enabled
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup-credentials
  namespace: donetick
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: scaleway-secret-manager
    kind: ClusterSecretStore
  target:
    name: cnpg-backup-credentials
    template:
      data:
        access_key_id: "{{ .access_key_id }}"
        secret_access_key: "{{ .secret_access_key }}"
        region: "garage"
  data:
  - secretKey: access_key_id
    remoteRef:
      key: name:homelab
      property: cnpg_backup_access_key_id
      version: latest_enabled
  - secretKey: secret_access_key
    remoteRef:
      key: name:homelab
      property: cnpg_backup_secret_access_key
      version: latest_enabled
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: donetick-postgres
  namespace: donetick
spec:
  configuration:
    destinationPath: "s3://cnpg-backups/donetick-postgres"
    endpointURL: "http://10.0.2.100:3900"
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-credentials
        key: access_key_id
      secretAccessKey:
        name: cnpg-backup-credentials
        key: secret_access_key
      region:
        name: cnpg-backup-credentials
        key: region
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: "30d"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: donetick-postgres
  namespace: donetick
spec:
  affinity:
    podAntiAffinityType: required
  instances: 2
  maxSyncReplicas: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3
  primaryUpdateStrategy: unsupervised
  storage:
    size: 1Gi
    storageClass: nfs
  bootstrap:
    initdb:
      database: donetick
      owner: donetick
      secret:
        name: donetick-db-password
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: donetick-postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: donetick-postgres
  namespace: donetick
spec:
  schedule: "0 45 3 * * *"
  backupOwnerReference: self
  cluster:
    name: donetick-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: donetick-postgres
  namespace: donetick
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: donetick-postgres
  podMetricsEndpoints:
  - port: metrics
---
# Mounted at /config, replacing the config directory baked into the image.
# Viper reads ./config/selfhosted.yaml relative to CWD (/) because DT_ENV=selfhosted.
# Secrets are deliberately absent here and supplied as DT_* env vars, which take
# precedence over the file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: donetick
  namespace: donetick
data:
  selfhosted.yaml: |
    name: "selfhosted"
    is_done_tick_dot_com: false
    is_user_creation_disabled: false
    database:
      type: "postgres"
      host: "donetick-postgres-rw"
      port: 5432
      user: "donetick"
      name: "donetick"
      migration: true
    jwt:
      session_time: 168h
      max_refresh: 1440h
    server:
      port: 2021
      read_timeout: 10s
      write_timeout: 10s
      rate_period: 60s
      rate_limit: 300
      serve_frontend: true
      serve_swagger: false
      public_host: "https://donetick.sonley.dev"
      cors_allow_origins:
        - "https://donetick.sonley.dev"
        - "capacitor://localhost"
    logging:
      level: "info"
      encoding: "json"
      development: false
    scheduler_jobs:
      due_job: 30m
      overdue_job: 3h
      pre_due_job: 3h
    oauth2:
      name: "Pocket ID"
      auth_url: "https://pocket-id.sonley.dev/authorize"
      token_url: "https://pocket-id.sonley.dev/api/oidc/token"
      user_info_url: "https://pocket-id.sonley.dev/api/oidc/userinfo"
      redirect_url: "https://donetick.sonley.dev/auth/oauth2"
      scopes:
        - "openid"
        - "profile"
        - "email"
    realtime:
      enabled: true
      sse_enabled: true
      heartbeat_interval: 60s
      connection_timeout: 120s
      max_connections: 1000
      max_connections_per_user: 5
      event_queue_size: 2048
      cleanup_interval: 2m
      stale_threshold: 5m
      enable_compression: true
      enable_stats: true
      allowed_origins:
        - "https://donetick.sonley.dev"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: donetick
  namespace: donetick
  annotations:
    secret.reloader.stakater.com/reload: "donetick"
    configmap.reloader.stakater.com/reload: "donetick"
spec:
  # Single replica: the due/overdue/pre-due scheduler jobs have no leader election,
  # so extra replicas would send duplicate notifications. The SSE hub is also
  # per-pod in-memory state.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: donetick
  template:
    metadata:
      labels:
        app.kubernetes.io/name: donetick
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: donetick
          image: donetick/donetick:v0.1.75
          ports:
            - containerPort: 2021
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: DT_ENV
              value: "selfhosted"
            - name: TZ
              value: "Europe/Paris"
            - name: DT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: donetick
                  key: jwt_secret
            - name: DT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: donetick
                  key: db_password
            - name: DT_OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: donetick
                  key: oidc_client_id
            - name: DT_OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: donetick
                  key: oidc_client_secret
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 2021
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 2021
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: donetick
---
apiVersion: v1
kind: Service
metadata:
  name: donetick
  namespace: donetick
  labels:
    app.kubernetes.io/name: donetick
spec:
  selector:
    app.kubernetes.io/name: donetick
  ports:
    - port: 2021
      targetPort: 2021
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: donetick
  namespace: donetick
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Donetick"
    gethomepage.dev/description: "Task and chore tracker"
    gethomepage.dev/group: "Productivity"
    gethomepage.dev/icon: "donetick.png"
    gethomepage.dev/href: "https://donetick.sonley.dev"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=donetick"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`donetick.sonley.dev`)
      services:
        - kind: Service
          name: donetick
          namespace: donetick
          port: 2021
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: donetick
  namespace: donetick
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: donetick
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: donetick
  namespace: donetick
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: donetick
  updatePolicy:
    updateMode: "Off"
