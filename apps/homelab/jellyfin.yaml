# Jellyfin runs on the NAS (10.0.2.100:8899), not in the cluster: this is only the Traefik route
# in front of it. Moved here from the Forgejo `karl/media` repo on 2026-10-17 so the rest of the
# old media stack (now on homelab-v2) and Forgejo can be decommissioned. Its own namespace, because
# `media` goes with that stack. Retire it when Jellyfin moves to the new cluster (G3).
---
apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  ports:
    - port: 8899
      targetPort: 8899
      name: http
---
apiVersion: v1
kind: Endpoints
metadata:
  name: jellyfin
  namespace: jellyfin
subsets:
  - addresses:
      - ip: 10.0.2.100
    ports:
      - port: 8899
        name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: jellyfin
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Jellyfin"
    gethomepage.dev/description: "Media server"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "jellyfin.png"
    gethomepage.dev/href: "https://jellyfin.sonley.dev"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`jellyfin.sonley.dev`)
      services:
        - kind: Service
          name: jellyfin
          namespace: jellyfin
          port: 8899
