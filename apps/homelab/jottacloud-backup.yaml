apiVersion: v1
kind: Namespace
metadata:
  name: jottacloud-backup
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nas-ssh-credentials
  namespace: jottacloud-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: scaleway-secret-manager
  target:
    name: nas-ssh-credentials
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
  - secretKey: username
    remoteRef:
      key: name:homelab
      property: nas_ssh_user
      version: latest_enabled
  - secretKey: password
    remoteRef:
      key: name:homelab
      property: nas_ssh_password
      version: latest_enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jottacloud-backup-script
  namespace: jottacloud-backup
data:
  backup.sh: |
    #!/bin/sh

    echo "=== Installing SSH tools ==="
    apk add --no-cache openssh-client sshpass

    # Write password to file to avoid shell quoting issues with sshpass
    PASSFILE=$(mktemp)
    printf '%s' "$NAS_SSH_PASSWORD" > "$PASSFILE"
    trap 'rm -f "$PASSFILE"' EXIT

    run_ssh() {
      echo "=== $1 ==="
      sshpass -f "$PASSFILE" ssh -o StrictHostKeyChecking=accept-new "$NAS_SSH_USER@10.0.2.100" "$2"
      RC=$?
      if [ $RC -ne 0 ]; then
        echo "FAILED (exit code $RC): $1"
        exit $RC
      fi
    }

    run_ssh "Checking rclone" "rclone version"
    run_ssh "Syncing /volume1" "rclone sync /volume1 jottacloud:nas_backup --verbose --stats 1m --transfers 4 --checkers 8 --retries 10 \
      --filter '- lost+found/' \
      --filter '- /@*/**' \
      --filter '- /media/**' \
      --filter '- /garage/meta/**' \
      --filter '- /k8s/*/pgdata/' \
      --filter '- /k8s/*/pgdata_*/' \
      --filter '- /k8s/*/wal/' \
      --filter '- /k8s/*/keys/' \
      --filter '- /k8s/*/attachments/' \
      --filter '- /k8s/forgejo-*/gitea/jwt/' \
      --filter '- /k8s/forgejo-*/gitea/actions_id_token/' \
      --filter '- /k8s/forgejo-*/gitea/conf/' \
      --filter '- /k8s/forgejo-*/gitea/indexers/' \
      --filter '- /k8s/forgejo-*/ssh/' \
      --filter '- /k8s/forgejo-*/git/.ssh/' \
      --filter '- /k8s/*-redis-data*/**' \
      --filter '- /k8s/monitoring-*/**' \
      --filter '- /k8s/media-*/**' \
      --filter '- /k8s/*meilisearch*/**' \
      --filter '- **/logrotate.status' \
      --filter '- /k8s/n8n-*/config'"

    echo "=== Backup completed successfully ==="
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jottacloud-backup
  namespace: jottacloud-backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jottacloud-backup
        spec:
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: jottacloud-backup
            image: alpine:3.23
            command: ["/bin/sh", "/scripts/backup.sh"]
            securityContext:
              allowPrivilegeEscalation: false
            env:
            - name: NAS_SSH_USER
              valueFrom:
                secretKeyRef:
                  name: nas-ssh-credentials
                  key: username
            - name: NAS_SSH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nas-ssh-credentials
                  key: password
            volumeMounts:
            - name: script
              mountPath: /scripts
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
          volumes:
          - name: script
            configMap:
              name: jottacloud-backup-script
              defaultMode: 0755
